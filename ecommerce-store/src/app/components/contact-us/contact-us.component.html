<section class="contact-shell">
  <div class="contact-header">
    <div>
      <h2>Contact us</h2>
    </div>
  </div>

  <form class="contact-form" (ngSubmit)="submit()">
    <label>
      <span>Name</span>
      <input [(ngModel)]="form.name" name="name" required />
    </label>
    <label>
      <span>Email</span>
      <input type="email" [(ngModel)]="form.email" name="email" required />
    </label>
    <label>
      <span>Phone</span>
      <input [(ngModel)]="form.phone" name="phone" required />
    </label>
    <label>
      <span>Subject</span>
      <input [(ngModel)]="form.subject" name="subject" required />
    </label>
    <label>
      <span>Message</span>
      <textarea rows="5" [(ngModel)]="form.message" name="message" required></textarea>
    </label>
    <button type="submit">Send message</button>
  </form>
</section>
