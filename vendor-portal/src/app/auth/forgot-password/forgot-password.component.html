<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-header">
      <p class="eyebrow">Password reset</p>
      <h1>Forgot your password?</h1>
    </div>

    <form *ngIf="!submitted" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>Email address</span>
        <input type="email" formControlName="email" placeholder="you@vendor.com" />
      </label>

      <p class="inline-error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <app-button type="submit" class="submit-btn">Send reset link</app-button>
    </form>

    <div *ngIf="submitted" class="success-box">
      <p>If that email exists, we've sent a reset link.</p>
    </div>

    <p class="switch-text">
      <a routerLink="/login">Back to login</a>
    </p>
  </div>
</section>
